[project]
name = "harness-common"
version = "0.10.0"
description = "Shared environment, service and execution models for harnesses"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_common"]
exclude = ["**/tests", "harness_common/report_kit/assets"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
exclude = ["harness_common/report_kit/assets"]
