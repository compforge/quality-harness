[project]
name = "harness-toolbox"
version = "0.11.4"
description = "Async infrastructure clients and execution-scoped resource sharing"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["harness-common>=0.10.2,<0.11"]

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
http = ["httpx[socks]>=0.27,<1"]
prometheus = ["pyyaml>=6,<7", "httpx[socks]>=0.27,<1", "prombed>=0.1.0"]
kube = ["kubernetes-asyncio>=36.1,<37"]
opensearch = ["httpx>=0.27,<1"]
mysql = ["sqlalchemy[asyncio]>=2.0,<3", "asyncmy>=0.2.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness_toolbox"]
exclude = ["**/tests"]

[tool.uv.sources]
harness-common = { workspace = true }
