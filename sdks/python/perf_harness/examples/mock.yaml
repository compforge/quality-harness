# Offline smoke: no live Service, no cluster. Exercises engine → probe → report,
# including the Case mix + by-facet pivot.
#   uv run python -m perf_harness.cli run perf_harness/examples/mock.yaml
name: mock-smoke                   # experiment name → runs/<name>/<run_id>/ (runs accumulate)

service:
  name: mock
  component:
    repository: { forge: github, path: compforge/quality-harness }
    name: mock
  environment: { name: local }
  base_url: http://127.0.0.1:0     # never dialled — MockRunner sleeps instead
                                   # (no deployer = already-deployed; resources only label arm_runs)

resources:
  - { workers: 2 }

runner:
  name: mock                       # the protocol adapter (here: the built-in mock)

# Reuse the canonical CaseSet. `cases` only selects/reorders cases and assigns
# this experiment's weights; input/facets/judges stay owned by mock_cases.yaml.
caseset: ./mock_cases.yaml
cases:
  - { id: hello,  weight: 70 }
  - { id: caocao, weight: 30 }

load:
  request_rate: inf
  max_inflight: 6
  hold_s: 3
  cooldown_timeout_s: 5


# client (inflight/sent) is always recorded; no `probes:` / `observe:` needed offline
observe_interval_s: 0.5
runs_dir: ./runs                   # each run → runs/mock-smoke/<run_id>/  (+ runs/mock-smoke/run.jsonl)
