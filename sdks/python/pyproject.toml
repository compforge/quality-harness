[project]
name = "quality-harness"
version = "0.2.2"
description = "Quality testing and evidence analysis SDKs for software and agents"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "atif>=1.7,<1.8",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "prombed>=0.1.0",
    # canonical Case model lives in the asset layer (spec-case); this repo is a runner
    "spec-case[model]>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "kubernetes-asyncio>=36.1,<37",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# corpus 三表的 parquet 持久化（机器查询面）；缺则 store 回退 jsonl，核心算子不受影响
trace-corpus = [
    "pyarrow>=14,<22",
]
kube = ["kubernetes-asyncio>=36.1,<37"]

[project.scripts]
e2e = "e2e_harness.cli:main"
casegen = "e2e_harness.casegen:main"
trace = "trace_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e_harness", "eval_harness", "perf_harness", "trace_harness", "trajectory_harness", "harness_common", "harness_toolbox"]
exclude = ["**/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests live INSIDE each package (tests follow their owner); `pytest` with no args runs all
testpaths = [
    "harness_common/tests",
    "harness_toolbox/tests",
    "e2e_harness/tests",
    "eval_harness/tests",
    "perf_harness/tests",
    "trace_harness/tests",
    "trajectory_harness/tests",
]

[dependency-groups]
dev = [
    "kubernetes-asyncio>=36.1,<37",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "setuptools>=82.0.1",
]

[tool.uv.sources]
prombed = { git = "https://github.com/compforge/prombed", subdirectory = "python" }
spec-case = { git = "https://github.com/compforge/spec-case", subdirectory = "toolchains/python" }
