service:
  name: widget-server
  operations:
    - {name: create_widget, method: POST, path: /api/v1/widgets}
  component:
    repository: { forge: github, path: example/widget }
    name: widget-server
  environment: { name: local }
  base_url: ${WIDGET_BASE_URL:-http://localhost:8080}
  headers:
    Authorization: Bearer ${WIDGET_TOKEN}

runtime:
  http_timeout_s: 30
