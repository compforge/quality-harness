# e2e-harness config.yaml schema
# 每个服务的 tests/e2e/config.yaml 遵循此结构

type: object
additionalProperties: false
required: [service]
properties:

  service:
    type: object
    additionalProperties: false
    required: [base_url]
    properties:
      name:
        type: string
        description: 服务标识
      component:
        type: object
        additionalProperties: false
        properties:
          repository:
            type: object
            additionalProperties: false
            properties:
              forge: {type: string}
              path: {type: string}
          name: {type: string}
      environment:
        type: object
        additionalProperties: false
        properties:
          name: {type: string}
          kind:
            enum: [generic, host, kubernetes]
            description: 环境形态；local/devbox 是环境名，主机访问方式由 host.transport 指定
          host:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1}
              transport: {enum: [local, ssh], default: local}
              address: {type: string}
            description: 可选的环境主机；Kubernetes 中表示集群操作入口，不表示 Pod 节点
          kubeconfig:
            type: string
            description: Environment.host 上的 Kubernetes kubeconfig 路径；省略 host 时在当前执行主机解释
          context:
            type: string
            description: 可选 Kubernetes context
      base_url:
        type: string
        description: 被测服务根 URL，支持 ${VAR:-default} 插值
      headers:
        type: object
        additionalProperties:
          type: string
        description: 访问该 Service 时注入的 header；不预设租户、用户或 token 协议

  runtime:
    type: object
    additionalProperties: false
    properties:
      http_timeout_s:
        type: integer
        default: 120
      poll_interval_ms:
        type: integer
        default: 500
      poll_timeout_s:
        type: integer
        default: 60
      parallel:
        type: integer
        default: 4

  profile:
    type: string
    default: "full"
    description: 环境 profile，用于条件跳过不适用的 case

  capabilities_endpoint:
    type: string
    default: "/healthz"
    description: 服务能力探测 endpoint

  custom:
    type: object
    additionalProperties:
      type: string
    description: 服务自定义配置区，框架透传不解析

  discover:
    type: object
    additionalProperties: false
    description: Python casegen 的可选源码与测试目录配置
    properties:
      source_root: {type: string}
      test_root: {type: string}

  # Agent Tier 扩展（Phase 5）
  judge:
    type: object
    additionalProperties: false
    properties:
      llm_endpoint:
        type: string
      llm_model:
        type: string
      llm_api_key:
        type: string
