$schema: https://json-schema.org/draft/2020-12/schema
$id: https://compforge.dev/schemas/perf-run-schema.yaml
title: Perf Harness Run
type: object
required:
- schema
- run_id
- experiment
- created_at
- service
- executions
- status
- environment
properties:
  schema:
    type: integer
    const: 12
  run_id:
    type: string
    minLength: 1
  experiment:
    type: string
    minLength: 1
  created_at:
    type: string
  service:
    type: string
    minLength: 1
  graph:
    type: object
    description: Optional Common Graph snapshot in the run environment; static topology, not observed calls.
    required: [schema_version, environment, nodes, relations]
    properties:
      schema_version: {const: 1}
      environment: {type: string, minLength: 1}
      nodes: {type: array}
      relations: {type: array}
  case_ids:
    type: array
    items: {type: string}
  observation_bindings:
    type: array
    items:
      type: object
      required: [target, service, metrics]
      properties:
        target: {type: string, minLength: 1}
        service: {type: string, minLength: 1}
        workload: {type: [string, 'null']}
        method: {type: string}
        path: {type: string}
        response_mode: {enum: [unary, sse, null]}
        metrics:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            required: [metric, unit]
            properties:
              metric: {type: string, minLength: 1}
              unit: {type: string}
              description: {type: string}
              semantics: {type: string}
  connection_budget:
    type: [object, 'null']
    properties:
      configured_max_connections: {type: [integer, 'null'], minimum: 1}
      effective_max_connections: {type: integer, minimum: 1}
  report_columns:
    type: array
    items:
      type: object
      required:
      - title
      - metric
      - window
      properties:
        title:
          type: string
        metric:
          type: string
        window:
          type: object
  executions:
    type: array
    items:
      $ref: '#/$defs/arm_run'
  status:
    enum:
    - completed
    - stopped
    - error
  environment:
    type: string
additionalProperties: true
$defs:
  resources:
    type: object
    properties:
      cpu:
        type:
        - string
        - 'null'
      memory:
        type:
        - string
        - 'null'
      workers:
        type:
        - integer
        - 'null'
        minimum: 1
      replicas:
        type: integer
        minimum: 1
      extra:
        type: object
        additionalProperties:
          type: string
    additionalProperties: true
  stage:
    type: object
    required:
    - duration_s
    - request_rate
    - max_inflight
    - kind
    properties:
      duration_s:
        type: number
        exclusiveMinimum: 0
      request_rate: &id001
        oneOf:
        - type: number
          minimum: 0
        - const: inf
      max_inflight:
        type: integer
        minimum: 1
      kind:
        enum:
        - warmup
        - hold
      shape:
        enum: [constant, ramp]
      name:
        type:
        - string
        - 'null'
  load:
    type: object
    required:
    - request_rate
    - max_inflight
    - hold_s
    properties:
      request_rate: *id001
      max_inflight:
        type: integer
        minimum: 1
      hold_s:
        type: number
        exclusiveMinimum: 0
      stages:
        type: array
        items:
          $ref: '#/$defs/stage'
      arrival:
        enum:
        - constant
        - poisson
      seed:
        type: integer
      warmup:
        type: object
        properties:
          step_s:
            type: number
            minimum: 0
      cooldown_timeout_s:
        type: number
        minimum: 0
      breaker_min_n:
        type: integer
        minimum: 1
      abort_on_error_rate:
        type:
        - number
        - 'null'
        exclusiveMinimum: 0
        maximum: 1
  distribution:
    type: object
    required:
    - kind
    - n
    - mean
    - p50
    - p95
    - p99
    - caveats
    properties:
      kind:
        const: distribution
      n:
        type: integer
        minimum: 0
      mean:
        type: number
      p50:
        type: number
      p95:
        type: number
      p99:
        type: number
      caveats:
        type: array
        items:
          type: string
        uniqueItems: true
    additionalProperties: true
  request_stats:
    type: object
    required:
    - n
    - n_ok
    - throughput_rps
    - p50_ms
    - p95_ms
    - p99_ms
    - mean_ms
    - error_rate
    - error_breakdown
    - n_dropped
    - caveats
    - metrics
    - arrived
    - dispatched
    - completed
    - succeeded
    - n_interrupted
    - n_pending
    - inflight_peak
    - inflight_end
    - arrival_rps
    - dispatch_rps
    - success_rps
    - unjudged
    - interrupted
    - n_judged
    - unjudged_rps
    - completed_by_code
    - throughput_by_code
    properties:
      n:
        type: integer
        minimum: 0
      n_ok:
        type: integer
        minimum: 0
      throughput_rps:
        type: number
        minimum: 0
      p50_ms:
        type: number
        minimum: 0
      p95_ms:
        type: number
        minimum: 0
      p99_ms:
        type: number
        minimum: 0
      mean_ms:
        type: number
        minimum: 0
      error_rate:
        type: number
        minimum: 0
        maximum: 1
      error_breakdown:
        type: object
        additionalProperties:
          type: integer
          minimum: 0
      n_dropped:
        type: integer
        minimum: 0
      caveats:
        type: array
        items:
          type: string
        uniqueItems: true
      metrics:
        type: object
        additionalProperties:
          $ref: '#/$defs/distribution'
      arrived:
        type: integer
        minimum: 0
      dispatched:
        type: integer
        minimum: 0
      completed:
        type: integer
        minimum: 0
      succeeded:
        type: integer
        minimum: 0
      n_pending: {type: integer, minimum: 0}
      n_interrupted:
        type: integer
        minimum: 0
      inflight_peak:
        type: integer
        minimum: 0
      inflight_end:
        type: integer
        minimum: 0
      arrival_rps:
        type: number
        minimum: 0
      dispatch_rps:
        type: number
        minimum: 0
      success_rps:
        type: number
        minimum: 0
      unjudged:
        type: integer
        minimum: 0
      interrupted:
        type: integer
        minimum: 0
      n_judged:
        type: integer
        minimum: 0
      unjudged_rps:
        type: number
        minimum: 0
      completed_by_code:
        type: object
        propertyNames:
          pattern: \S
        additionalProperties:
          type: integer
          minimum: 0
      throughput_by_code:
        type: object
        propertyNames:
          pattern: \S
        additionalProperties:
          type: number
          minimum: 0
    additionalProperties: true
  window:
    type: object
    required:
    - id
    - name
    - kind
    - start_s
    - end_s
    - complete
    - request
    - by_case
    - by_facet
    - probe_metrics
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      kind:
        enum:
        - full
        - phase
        - custom
      phase:
        enum: [warmup, hold, cooldown, null]
      start_s:
        type: number
        description: Relative to load start; traffic ranges exclude setup and cleanup.
      end_s:
        type: number
        minimum: 0
      complete:
        type: boolean
      target_level:
        type:
        - number
        - 'null'
        minimum: 0
      end_reason:
        type:
        - string
        - 'null'
      limited_s:
        type: number
        minimum: 0
      request:
        oneOf:
        - $ref: '#/$defs/request_stats'
        - type: 'null'
      by_case:
        type: object
        additionalProperties:
          $ref: '#/$defs/request_stats'
      by_facet:
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            $ref: '#/$defs/request_stats'
      probe_metrics:
        type: object
    additionalProperties: true
  stop:
    type: object
    required:
    - reason
    - inflight_at_stop
    - interrupted
    - force_cancelled
    properties:
      reason:
        enum:
        - deadline
        - error_rate
        - request_limit
        - aborted
      snapshot:
        type:
        - object
        - 'null'
      inflight_at_stop:
        type: integer
        minimum: 0
      interrupted:
        type: integer
        minimum: 0
      force_cancelled:
        type: boolean
    additionalProperties: true
  phase_error:
    type: object
    required:
    - phase
    - error_type
    - message
    properties:
      phase:
        enum:
        - setup
        - warmup
        - hold
        - cooldown
        - cleanup
      error_type:
        type: string
        minLength: 1
      message:
        type: string
    additionalProperties: true
  phase_run:
    type: object
    required: [id, name, kind, start_s, end_s, complete]
    properties:
      id: {type: string}
      name: {type: string}
      kind: {enum: [setup, warmup, hold, cooldown, cleanup]}
      start_s: {type: number}
      end_s: {type: number}
      complete: {type: boolean}
    description: Serial nonoverlapping executed lifecycle phases. Setup and cleanup do not own traffic windows.
  arm_run:
    type: object
    required:
    - id
    - service
    - arm
    - stop
    - registry
    - windows
    - phases
    - probe_errors
    properties:
      id:
        type: string
        minLength: 1
      service:
        type: string
        minLength: 1
      started_at:
        type: string
      finished_at:
        type: string
      arm:
        type: object
        required:
        - id
        - resources
        - load
        properties:
          id:
            type: string
            minLength: 1
          resources:
            $ref: '#/$defs/resources'
          load:
            $ref: '#/$defs/load'
        additionalProperties: true
      stop:
        $ref: '#/$defs/stop'
      registry:
        type: object
      phases:
        type: array
        items: {$ref: "#/$defs/phase_run"}
      windows:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/window'
      started_at_s:
        type: [number, 'null']
        description: Unix seconds corresponding to the ArmRun relative load origin.
      prometheus_observations:
        type: array
        items:
          type: object
          required: [probe, metric, expression, source_url, datasource_kind, start_s, end_s, step_s, labels]
          properties:
            probe: {type: string}
            metric: {type: string}
            expression: {type: string}
            source_url: {type: string}
            datasource_kind: {type: string, minLength: 1}
            start_s: {type: number}
            end_s: {type: number}
            step_s:
              type: [number, 'null']
              description: Positive range-query step in seconds; null selects an instant query at end_s.
            labels:
              type: object
              additionalProperties: {type: string}
            result_labels:
              type: array
              items: {type: string}
            window_id: {type: [string, 'null']}
            data: {type: [object, 'null']}
            warnings:
              type: array
              items: {type: string}
            infos:
              type: array
              items: {type: string}
            error: {type: [string, 'null']}
            collected_at_s: {type: [number, 'null']}
            histogram:
              type: [object, 'null']
              properties:
                quantile: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
                scale: {type: number, exclusiveMinimum: 0}
              description: Explicit classic-bucket projection. Scalar summary value is the string +Inf on proven overflow, with histogram sample_count/max_finite_bucket/overflow metadata.
          additionalProperties: true
      window_observations:
        type: array
        items:
          type: object
          required:
          - probe
          - window_id
          - metric
          - expression
          - source_key
          - start_ms
          - end_ms
          - values
          properties:
            probe:
              type: string
            window_id:
              type: string
            metric:
              type: string
            expression:
              type: string
            source_key:
              type: string
            start_ms:
              type: integer
            end_ms:
              type: integer
            values:
              type: object
              additionalProperties:
                type: number
            error:
              type:
              - string
              - 'null'
      probe_errors:
        type: object
      phase_errors:
        type: array
        items:
          $ref: '#/$defs/phase_error'
    additionalProperties: true
