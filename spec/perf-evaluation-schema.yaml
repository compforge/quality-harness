$schema: https://json-schema.org/draft/2020-12/schema
title: Perf request evaluations by ArmRun and OperationRun ID
type: object
additionalProperties:
  type: object
  additionalProperties:
    type: object
    required:
    - result
    properties:
      error_kind:
        type:
        - string
        - 'null'
      result:
        enum:
        - success
        - failure
        - rejected
        - timeout
